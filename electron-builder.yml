appId: com.bipane.app
productName: Bipane
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - resources/icon.png
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: true
linux:
  icon: resources/icon.png
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: Modern dual-pane file manager
  description: A modern orthodox (dual-pane) file manager with a VSCode-inspired interface and an integrated terminal.
